name: verification

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: explorex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d explorex_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/explorex_test
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/explorex_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/explorex_test
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_TEST_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_TEST_SECRET_KEY }}
      E2E_EMAIL: ${{ secrets.CLERK_TEST_EMAIL }}
      E2E_PASSWORD: ${{ secrets.CLERK_TEST_PASSWORD }}
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm audit
      - run: npm run build
      - name: Install Chromium for browser journey
        if: ${{ env.E2E_EMAIL != '' && env.E2E_PASSWORD != '' && env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY != '' && env.CLERK_SECRET_KEY != '' }}
        run: npx playwright install --with-deps chromium
      - name: Run authenticated browser journey
        if: ${{ env.E2E_EMAIL != '' && env.E2E_PASSWORD != '' && env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY != '' && env.CLERK_SECRET_KEY != '' }}
        run: npm run test:e2e
